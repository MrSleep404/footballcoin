app:
  description: 五大联赛赛前预测：采集赛程与积分榜，逐场调用 LLM 生成胜平负概率，并通过 GitHub Contents API 直接写入 data/matches 目录。
  icon: ''
  icon_background: '#E8F6EE'
  mode: workflow
  name: FootballCoin 五大联赛预测
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: football-data.org 的 X-Auth-Token
    id: 0b6a0f2e-51a7-4b0a-9f6e-3a5d1c8e7f01
    name: FD_TOKEN
    selector:
    - env
    - FD_TOKEN
    value: ''
    value_type: secret
  - description: GitHub 仓库 owner
    id: 0b6a0f2e-51a7-4b0a-9f6e-3a5d1c8e7f02
    name: GH_OWNER
    selector:
    - env
    - GH_OWNER
    value: ''
    value_type: string
  - description: GitHub 仓库名
    id: 0b6a0f2e-51a7-4b0a-9f6e-3a5d1c8e7f03
    name: GH_REPO
    selector:
    - env
    - GH_REPO
    value: ''
    value_type: string
  - description: 目标分支
    id: 0b6a0f2e-51a7-4b0a-9f6e-3a5d1c8e7f04
    name: GH_BRANCH
    selector:
    - env
    - GH_BRANCH
    value: main
    value_type: string
  - description: fine-grained PAT，需要目标仓库 Contents 读写权限
    id: 0b6a0f2e-51a7-4b0a-9f6e-3a5d1c8e7f05
    name: GH_TOKEN
    selector:
    - env
    - GH_TOKEN
    value: ''
    value_type: secret
  - description: 写入数据文件 model 字段的模型名
    id: 0b6a0f2e-51a7-4b0a-9f6e-3a5d1c8e7f06
    name: MODEL_NAME
    selector:
    - env
    - MODEL_NAME
    value: gpt-4o-mini
    value_type: string
  - description: 是否把生成的数据同步到 GitHub；填 false 时只输出文件内容，便于本地测试
    id: 0b6a0f2e-51a7-4b0a-9f6e-3a5d1c8e7f07
    name: SYNC_TO_GITHUB
    selector:
    - env
    - SYNC_TO_GITHUB
    value: 'true'
    value_type: string
  - description: 运行模式：predict 只更新预测、results 只更新赛果、both 两者都更新
    id: 0b6a0f2e-51a7-4b0a-9f6e-3a5d1c8e7f08
    name: RUN_MODE
    selector:
    - env
    - RUN_MODE
    value: both
    value_type: string
  - description: 赛事范围：domestic 五大联赛、europe 欧冠、all 全部
    id: 7c1d4a90-2f63-4e8b-9b57-9d0e6a3c2f11
    name: COMPETITION_SET
    selector:
    - env
    - COMPETITION_SET
    value: domestic
    value_type: string
  - description: API-Football 的 x-apisports-key，用于拉取最近 3 个比赛日的伤停；留空则无伤病数据
    id: 7c1d4a90-2f63-4e8b-9b57-9d0e6a3c2f12
    name: API_FOOTBALL_KEY
    selector:
    - env
    - API_FOOTBALL_KEY
    value: ''
    value_type: secret
  - description: The Odds API 的 apiKey，用于拉取赛前胜平负赔率；留空则无市场概率
    id: 7c1d4a90-2f63-4e8b-9b57-9d0e6a3c2f13
    name: ODDS_API_KEY
    selector:
    - env
    - ODDS_API_KEY
    value: ''
    value_type: secret
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
