    - data:
        code: |
          import base64
          import json
          from datetime import datetime, timedelta, timezone

          BJ = timezone(timedelta(hours=8))


          def _as_dict(payload):
              if isinstance(payload, dict):
                  return payload
              if isinstance(payload, str):
                  try:
                      parsed = json.loads(payload)
                      return parsed if isinstance(parsed, dict) else {}
                  except ValueError:
                      return {}
              return {}


          def _decode(body):
              text = body.get("content") or ""
              if not text:
                  return {}
              try:
                  return json.loads(base64.b64decode(str(text)).decode("utf-8"))
              except (TypeError, ValueError):
                  return {}


          def _split(score):
              try:
                  home, away = [int(part) for part in str(score).split("-")]
                  return home, away
              except (TypeError, ValueError):
                  return None


          def main(additions, cache, enabled) -> dict:
              body = _as_dict(cache)
              sha = str(body.get("sha") or "")
              if str(enabled or "").strip().lower() != "true" or not sha:
                  return {"changed": False, "contentBase64": "", "sha": sha, "updated": 0}
              data = _decode(body)
              leagues = data.get("leagues") or {}
              updated = 0
              for code, pairs in (additions or {}).items():
                  target = leagues.setdefault(code, {})
                  for key, games in (pairs or {}).items():
                      entry = target.get(key)
                      if not isinstance(entry, dict):
                          entry = {"played": 0, "homeWins": 0, "draws": 0, "awayWins": 0, "last": []}
                      last = list(entry.get("last") or [])
                      known = {(item.get("date"), item.get("score")) for item in last}
                      for game in games or []:
                          scores = _split(game.get("score"))
                          if not scores:
                              continue
                          if game.get("lowIsHome"):
                              item = {
                                  "date": game.get("date"),
                                  "home": game.get("home"),
                                  "away": game.get("away"),
                                  "score": f"{scores[0]}-{scores[1]}",
                              }
                          else:
                              item = {
                                  "date": game.get("date"),
                                  "home": game.get("away"),
                                  "away": game.get("home"),
                                  "score": f"{scores[1]}-{scores[0]}",
                              }
                          if (item["date"], item["score"]) in known:
                              continue
                          home_goals, away_goals = _split(item["score"])
                          entry["played"] = int(entry.get("played") or 0) + 1
                          if home_goals == away_goals:
                              entry["draws"] = int(entry.get("draws") or 0) + 1
                          elif home_goals > away_goals:
                              entry["homeWins"] = int(entry.get("homeWins") or 0) + 1
                          else:
                              entry["awayWins"] = int(entry.get("awayWins") or 0) + 1
                          last.append(item)
                          known.add((item["date"], item["score"]))
                          updated += 1
                      if last:
                          entry["last"] = sorted(last, key=lambda item: item.get("date") or "", reverse=True)[:5]
                      target[key] = entry
              if not updated:
                  return {"changed": False, "contentBase64": "", "sha": sha, "updated": 0}
              data["updatedAt"] = datetime.now(BJ).isoformat(timespec="seconds")
              text = json.dumps(data, ensure_ascii=False, indent=2)
              return {
                  "changed": True,
                  "contentBase64": base64.b64encode(text.encode("utf-8")).decode("ascii"),
                  "sha": sha,
                  "updated": updated,
              }
        code_language: python3
        desc: ''
        outputs:
          changed:
            children: null
            type: boolean
          contentBase64:
            children: null
            type: string
          sha:
            children: null
            type: string
          updated:
            children: null
            type: number
