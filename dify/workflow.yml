    - data:
        code: |
          import json


          def _price(value):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return None


          def _events(body):
              if isinstance(body, str):
                  try:
                      body = json.loads(body)
                  except ValueError:
                      return []
              if isinstance(body, list):
                  return body
              if isinstance(body, dict):
                  data = body.get("data")
                  if isinstance(data, list):
                      return data
              return []


          def main(item: dict, body) -> dict:
              league = (item or {}).get("league") or ""
              events = []
              for event in _events(body):
                  if not isinstance(event, dict):
                      continue
                  home = str(event.get("home_team") or "")
                  away = str(event.get("away_team") or "")
                  if not home or not away:
                      continue
                  triples = []
                  latest = ""
                  for book in event.get("bookmakers") or []:
                      for market in book.get("markets") or []:
                          if market.get("key") != "h2h":
                              continue
                          prices = {
                              str(outcome.get("name") or ""): _price(outcome.get("price"))
                              for outcome in market.get("outcomes") or []
                          }
                          home_price = prices.get(home)
                          draw_price = prices.get("Draw")
                          away_price = prices.get(away)
                          if home_price and draw_price and away_price:
                              triples.append((home_price, draw_price, away_price))
                              stamp = str(market.get("last_update") or book.get("last_update") or "")
                              if stamp > latest:
                                  latest = stamp
                  if not triples:
                      continue
                  shares = [0.0, 0.0, 0.0]
                  for triple in triples:
                      inverse = [1.0 / value for value in triple]
                      overround = sum(inverse)
                      for index in range(3):
                          shares[index] += inverse[index] / overround
                  prob = [value / len(triples) * 100 for value in shares]
                  rounded = [int(round(value)) for value in prob]
                  rounded[max(range(3), key=lambda index: prob[index])] += 100 - sum(rounded)
                  events.append(
                      {
                          "home": home,
                          "away": away,
                          "commence": str(event.get("commence_time") or ""),
                          "books": len(triples),
                          "prob": {"home": rounded[0], "draw": rounded[1], "away": rounded[2]},
                          "capturedAt": latest,
                      }
                  )
              return {"pack": {"league": league, "events": events}}
        code_language: python3
        desc: ''
        isInIteration: true
        iteration_id: iter_odds
        outputs:
          pack:
            children: null
