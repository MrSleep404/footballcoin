    - data:
        code: |
          import html
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime


          def _text(node, *names):
              for name in names:
                  found = node.find(name)
                  if found is not None and found.text:
                      return found.text.strip()
              for child in node:
                  if child.tag.split("}")[-1] in names and child.text:
                      return child.text.strip()
              return ""


          def _clean(text):
              text = re.sub(r"<[^>]+>", " ", text or "")
              return re.sub(r"\s+", " ", html.unescape(text)).strip()


          def main(feed: dict, body) -> dict:
              key = str((feed or {}).get("key") or "")
              name = str((feed or {}).get("name") or key)
              items = []
              if not body:
                  return {"feed": {"key": key, "items": items}}
              try:
                  root = ET.fromstring(body)
              except ET.ParseError:
                  return {"feed": {"key": key, "items": items}}
              for node in root.iter():
                  if node.tag.split("}")[-1] not in ("item", "entry"):
                      continue
                  title = _clean(_text(node, "title"))
                  link = _text(node, "link")
                  if not link:
                      for child in node:
                          if child.tag.split("}")[-1] == "link":
                              link = child.get("href") or ""
                  summary = _clean(_text(node, "description", "summary", "content"))
                  raw_date = _text(node, "pubDate", "published", "updated")
                  published = ""
                  try:
                      published = parsedate_to_datetime(raw_date).astimezone(timezone.utc).strftime("%Y-%m-%d")
                  except (TypeError, ValueError):
                      try:
                          published = datetime.fromisoformat(raw_date.replace("Z", "+00:00")).strftime("%Y-%m-%d")
                      except ValueError:
                          published = ""
                  if not title or not link:
                      continue
                  items.append({
                      "title": title[:160],
                      "summary": summary[:240],
                      "link": link,
                      "published": published,
                      "source": name,
                  })
              return {"feed": {"key": key, "items": items}}
