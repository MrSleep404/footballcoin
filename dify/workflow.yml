    - data:
        code: |
          import re
          import unicodedata

          STOP = {
              "fc", "cf", "afc", "club", "calcio", "cp", "sv", "ac", "sc", "the",
              "de", "do", "da", "1899", "05", "04", "01",
          }
          REPL = str.maketrans({"ø": "o", "ß": "ss", "æ": "ae", "ł": "l"})
          PHRASE_ALIAS = (
              (("manchester", "united"), ("man utd", "man united")),
              (("manchester", "city"), ("man city",)),
              (("tottenham",), ("spurs",)),
              (("wolverhampton",), ("wolves",)),
              (("paris",), ("psg",)),
              (("barcelona",), ("barca",)),
              (("atletico",), ("atleti",)),
              (("juventus",), ("juve",)),
              (("dortmund",), ("bvb",)),
              (("internazionale",), ("inter",)),
              (("munchen",), ("munich", "bayern")),
              (("koln",), ("cologne",)),
              (("monchengladbach",), ("gladbach",)),
          )
          ALIAS_RULES = (
              (("milan",), ("milan",), ("inter", "internazionale")),
          )
          AMBIGUOUS = {
              "manchester", "milan", "madrid", "lisbon", "athens", "istanbul",
              "baku", "glasgow", "turin", "rome", "prague",
          }


          def _tokens(text):
              text = unicodedata.normalize("NFKD", str(text or "").translate(REPL))
              text = "".join(ch for ch in text if not unicodedata.combining(ch))
              text = text.lower().replace("&", " and ")
              return [token for token in re.split(r"[^a-z]+", text) if token and token not in STOP]


          def _team(name, freq):
              tokens = _tokens(name)
              if not tokens:
                  return None
              aliases = []
              for keywords, extra in PHRASE_ALIAS:
                  if all(keyword in tokens for keyword in keywords):
                      aliases.extend(extra)
              negatives = []
              for keywords, extra, blocked in ALIAS_RULES:
                  if all(keyword in tokens for keyword in keywords):
                      aliases.extend(extra)
                      negatives.extend(blocked)
              return {
                  "full": " ".join(tokens),
                  "aliases": aliases,
                  "negatives": negatives,
                  "unique": [
                      t for t in tokens
                      if len(t) >= 4 and t not in AMBIGUOUS and freq.get(t, 0) == 1
                  ],
              }


          def main(matches: list, feeds) -> dict:
              items = []
              for feed in feeds if isinstance(feeds, list) else []:
                  for item in (feed or {}).get("items") or []:
                      if isinstance(item, dict) and item.get("link"):
                          items.append(item)

              freq = {}
              for match in matches or []:
                  for side in ("home", "away"):
                      for token in set(_tokens((match.get(side) or {}).get("nameEn"))):
                          freq[token] = freq.get(token, 0) + 1

              result = []
              for match in matches or []:
                  teams = [team for team in (
                      _team((match.get("home") or {}).get("nameEn"), freq),
                      _team((match.get("away") or {}).get("nameEn"), freq),
                  ) if team]
                  if not teams:
                      result.append(match)
                      continue
                  scored = []
                  for item in items:
                      tokens = _tokens(f"{item.get('title') or ''} {item.get('summary') or ''}")
                      text = " " + " ".join(tokens) + " "
                      score = 0
                      for team in teams:
                          if f" {team['full']} " in text:
                              score += 4
                          blocked = any(token in tokens for token in team["negatives"])
                          if not blocked and any(f" {alias} " in text for alias in team["aliases"]):
                              score += 3
                          score += sum(1 for token in team["unique"] if f" {token} " in text)
                      if score:
                          scored.append((score, item.get("published") or "", item))
                  scored.sort(key=lambda row: (row[0], row[1]), reverse=True)
                  picked = []
                  seen = set()
                  for _, _, item in scored:
                      if item["link"] in seen:
                          continue
                      seen.add(item["link"])
                      picked.append(item)
                      if len(picked) >= 3:
                          break
                  if picked:
                      match["news"] = picked
                  else:
                      match.pop("news", None)
                  result.append(match)
              return {"matches": result, "newsMatches": sum(1 for item in result if item.get("news"))}
        code_language: python3
