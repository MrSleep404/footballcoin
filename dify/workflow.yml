    - data:
        code: |
          import base64
          import json


          def _as_dict(raw):
              if isinstance(raw, dict):
                  return raw
              try:
                  value = json.loads(raw or "{}")
              except (TypeError, ValueError):
                  return {}
              return value if isinstance(value, dict) else {}


          def _decode(value):
              text = str(value or "").strip()
              if not text:
                  return {}
              try:
                  raw = base64.b64decode(text.encode("ascii")).decode("utf-8")
                  data = json.loads(raw)
              except (TypeError, ValueError):
                  return {}
              return data if isinstance(data, dict) else {}


          def main(body, content: str, date: str) -> dict:
              payload = _as_dict(body)
              sha = str(payload.get("sha") or "")
              old = _decode(payload.get("content"))
              incoming = _decode(content)

              merged = {}
              for match in old.get("matches") or []:
                  if isinstance(match, dict) and match.get("id"):
                      merged[match["id"]] = match
              for match in incoming.get("matches") or []:
                  if isinstance(match, dict) and match.get("id"):
                      merged[match["id"]] = match

              matches = sorted(merged.values(), key=lambda item: str(item.get("kickoff") or ""))
              data = {
                  "schemaVersion": incoming.get("schemaVersion") or old.get("schemaVersion") or 1,
                  "date": date,
                  "generatedAt": incoming.get("generatedAt") or old.get("generatedAt") or "",
                  "source": incoming.get("source") or old.get("source") or "football-data.org",
                  "model": incoming.get("model") or old.get("model") or "",
                  "matchCount": len(matches),
                  "degradedCount": sum(1 for item in matches if item.get("degraded")),
                  "matches": matches,
              }
              text = json.dumps(data, ensure_ascii=False, indent=2)
              return {
                  "sha": sha,
                  "contentBase64": base64.b64encode(text.encode("utf-8")).decode("ascii"),
                  "added": len(incoming.get("matches") or []),
                  "total": len(matches),
              }
