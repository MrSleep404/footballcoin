          def main(day: dict, model: str) -> dict:
              date = day.get("date")
              matches = day.get("matches") or []
              payload = {
                  "schemaVersion": 1,
                  "date": date,
                  "generatedAt": datetime.now(BJ).isoformat(timespec="seconds"),
                  "source": "football-data.org",
                  "model": model,
                  "matchCount": len(matches),
                  "degradedCount": sum(1 for item in matches if item.get("degraded")),
                  "matches": matches,
              }
              text = json.dumps(payload, ensure_ascii=False, indent=2)
              byte_size = len(text.encode("utf-8"))
              return {
                  "date": date,
                  "content": text,
                  "file": {
                      "date": date,
                      "content": text,
                      "byteSize": byte_size,
                  },
                  "contentBase64": base64.b64encode(text.encode("utf-8")).decode("ascii"),
                  "commitMessage": f"data: {date} 预测（{len(matches)} 场）",
                  "byteSize": byte_size,
              }
