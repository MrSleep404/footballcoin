    - data:
        code: |
          import base64
          import json

          ORDER = ("PL", "PD", "SA", "BL1", "FL1", "CL")


          def _as_dict(raw):
              if isinstance(raw, dict):
                  return raw
              try:
                  value = json.loads(raw or "{}")
              except (TypeError, ValueError):
                  return {}
              return value if isinstance(value, dict) else {}


          def _existing(payload):
              text = payload.get("content") or ""
              if not text:
                  return {}
              try:
                  raw = base64.b64decode(text.encode("ascii")).decode("utf-8")
                  value = json.loads(raw)
              except (TypeError, ValueError):
                  return {}
              return value if isinstance(value, dict) else {}


          def main(body, content: str) -> dict:
              payload = _as_dict(body)
              sha = str(payload.get("sha") or "")
              old = _existing(payload)
              try:
                  incoming = json.loads(base64.b64decode(content.encode("ascii")).decode("utf-8"))
              except (TypeError, ValueError):
                  incoming = {}

              merged = {}
              for league in old.get("leagues") or []:
                  if isinstance(league, dict) and league.get("code"):
                      merged[league["code"]] = league
              for league in incoming.get("leagues") or []:
                  if isinstance(league, dict) and league.get("code"):
                      merged[league["code"]] = league

              leagues = [merged[code] for code in ORDER if code in merged]
              leagues += [value for key, value in merged.items() if key not in ORDER]
              data = {
                  "schemaVersion": 1,
                  "updatedAt": incoming.get("updatedAt") or old.get("updatedAt") or "",
                  "leagues": leagues,
              }
              text = json.dumps(data, ensure_ascii=False, indent=2)
              return {
                  "sha": sha,
                  "contentBase64": base64.b64encode(text.encode("utf-8")).decode("ascii"),
              }
