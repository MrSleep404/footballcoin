    - data:
        code: |
          from datetime import datetime, timedelta, timezone
          import unicodedata

          BJ = timezone(timedelta(hours=8))
          STOPWORDS = {
              "fc", "cf", "afc", "sc", "ac", "as", "us", "ss", "ssc", "sv",
              "vfl", "vfb", "tsg", "bsc", "kv", "rb", "club", "de", "do", "calcio",
          }
          ALIASES = {
              "munchen": "munich",
              "moenchengladbach": "gladbach",
              "monchengladbach": "gladbach",
              "inter": "internazionale",
          }


          def _tokens(name):
              text = unicodedata.normalize("NFKD", str(name or ""))
              text = "".join(ch for ch in text if not unicodedata.combining(ch)).lower()
              for src, dst in (("ø", "o"), ("ß", "ss"), ("æ", "ae"), ("ł", "l"), ("đ", "d"), ("ı", "i")):
                  text = text.replace(src, dst)
              for sep in "-'’.&/":
                  text = text.replace(sep, " ")
              return [ALIASES.get(token, token) for token in text.split() if token and token not in STOPWORDS]


          def _find(teams, name):
              tokens = _tokens(name)
              if not tokens:
                  return []
              key = " ".join(sorted(tokens))
              if key in teams:
                  return teams[key]
              current = set(tokens)
              for other, items in teams.items():
                  candidate = set(other.split())
                  if len(current) >= 2 and current <= candidate:
                      return items
                  if len(candidate) >= 2 and candidate <= current:
                      return items
              return []


          def _line(label, items):
              if not items:
                  return f"{label}：暂无官方伤停记录"
              parts = []
              for item in items[:5]:
                  reason = item.get("reason") or item.get("type") or "伤缺"
                  parts.append(f"{item.get('player')}（{reason}）")
              return f"{label}：" + "、".join(parts)


          def main(match: dict, injuries: dict, injury_date: str) -> dict:
              home = match.get("home") or {}
              away = match.get("away") or {}
              kickoff = match.get("kickoff")
              try:
                  moment = datetime.fromisoformat(str(kickoff).replace("Z", "+00:00"))
                  bj = moment.astimezone(BJ).strftime("%Y-%m-%d %H:%M")
                  # API-Football 的 date 参数按 UTC 日期划分赛程
                  day = moment.astimezone(timezone.utc).strftime("%Y-%m-%d")
              except (TypeError, ValueError):
                  bj = str(kickoff)
                  day = ""

              form_home = " ".join(home.get("form") or []) or "暂无"
              form_away = " ".join(away.get("form") or []) or "暂无"

              h2h = match.get("h2h") or {}
              played = int(h2h.get("played") or 0)
              if played:
                  h2h_text = (
                      f"交手记录（近 {played} 次）：主队 {h2h.get('homeWins', 0)} 胜 / "
                      f"{h2h.get('draws', 0)} 平 / 客队 {h2h.get('awayWins', 0)} 胜"
                  )
                  last = h2h.get("last") or []
                  if last:
                      pieces = [
                          f"{item.get('date')} {item.get('home')} {item.get('score')} {item.get('away')}"
                          for item in last[:3]
                      ]
                      h2h_text += "；最近：" + "、".join(pieces)
              else:
                  h2h_text = "交手记录：暂无双方历史交锋数据"

              weather = match.get("weather") or {}
              if weather:
                  weather_text = (
                      f"天气（开赛时）：气温 {weather.get('temp')}℃，降水概率 {weather.get('precip')}%，"
                      f"风速 {weather.get('wind')} km/h"
                  )
              else:
                  weather_text = "天气：未提供"

              market = match.get("market") or {}
              market_prob = market.get("prob") or {}
              if all(market_prob.get(key) is not None for key in ("home", "draw", "away")):
                  market_text = (
                      f"市场赔率（{market.get('bookmaker') or '博彩公司'}，已去水）："
                      f"主胜 {market_prob.get('home')}% / 平局 {market_prob.get('draw')}% / "
                      f"客胜 {market_prob.get('away')}%"
                  )
              else:
                  market_text = "市场赔率：未提供"

              teams = (injuries or {}).get("teams") or {}
              if injury_date and teams and day == injury_date:
                  injury_text = (
                      f"伤病情况（API-Football，{injury_date} 名单）：\n"
                      f"{_line(home.get('name', '') + '伤停', _find(teams, home.get('nameEn')))}\n"
                      f"{_line(away.get('name', '') + '伤停', _find(teams, away.get('nameEn')))}"
                  )
              elif injury_date and teams:
                  injury_text = f"伤病情况：仅提供 {injury_date} 的名单，本场日期不同，未提供。"
              else:
                  injury_text = "伤病情况：未提供。"

              text = (
                  f"比赛：{home.get('name')}（主） vs {away.get('name')}（客）\n"
                  f"联赛：{match.get('leagueName')}（{match.get('league')}），第 {match.get('matchday') or '-'} 轮\n"
                  f"开赛：{bj}（北京时间），场地：{match.get('venue') or '未提供'}\n"
                  f"积分排名：主队第 {home.get('rank')}，客队第 {away.get('rank')}\n"
                  f"近 5 场：主队 {form_home}，客队 {form_away}\n"
                  f"赛季进失球：主队 {home.get('goalsFor')}/{home.get('goalsAgainst')}，客队 {away.get('goalsFor')}/{away.get('goalsAgainst')}\n"
                  f"{h2h_text}\n"
                  f"{weather_text}\n"
                  f"{market_text}\n"
                  f"{injury_text}\n"
                  f"其他信息：未提供"
              )
              return {"result": text}
