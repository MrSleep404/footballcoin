              ("brugge", "Bruges"),
              ("slavia", "Prague"),
              ("sporting", "Lisbon"),
              ("shakhtar", "Donetsk"),
              ("bodø", "Bodø"),
              ("bodo", "Bodo"),
              ("sabah", "Baku"),
              ("brest", "Brest"),
          )
          DROP = {
              "fc", "cf", "afc", "sc", "ac", "sv", "fk", "sk", "kv", "club",
              "calcio", "stade", "cp", "clube", "de", "do", "da", "the",
          }


          def _tla(match):
              parts = str(match.get("id") or "").split("-")
              return parts[-2] if len(parts) >= 2 else ""


          def _coords(league, tla):
              direct = COORDS.get(f"{league}:{tla}")
              if direct:
                  return direct
              # 仅欧冠允许跨联赛回退（同一支球队在国内联赛与欧冠共用 TLA）
              if league != "CL":
                  return None
              found = [value for key, value in COORDS.items() if key.split(":")[-1] == tla]
              return found[0] if len(found) == 1 else None


          def _query(match):
              home = match.get("home") or {}
              raw = str(home.get("nameEn") or home.get("name") or "").strip().lower()
              for hint, city in HINTS:
                  if hint in raw:
                      return quote(city)
              tokens = [
                  token
                  for token in re.split(r"[^0-9a-zà-ÿ]+", raw)
                  if len(token) > 2 and not token.isdigit() and token not in DROP
              ]
              return quote(" ".join(tokens[:2]).title()) if tokens else ""


          def main(matches: list) -> dict:
              spots = []
              missing = []
              seen = set()
              index = 0
              for match in matches or []:
                  league = match.get("league") or ""
                  key = f"{league}:{_tla(match)}"
                  if key in seen:
                      continue
                  if len(spots) + len(missing) >= MAX_SPOTS:
                      break
                  seen.add(key)
                  point = _coords(league, _tla(match))
                  if point:
                      spots.append({"key": key, "index": index, "lat": point[0], "lon": point[1]})
                  else:
                      query = _query(match)
                      if query:
