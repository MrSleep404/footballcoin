    - data:
        code: |
          import base64
          import gzip
          import json
          from datetime import datetime, timedelta, timezone

          BJ = timezone(timedelta(hours=8))


          def _as_dict(payload):
              if isinstance(payload, dict):
                  return payload
              if isinstance(payload, str):
                  try:
                      parsed = json.loads(payload)
                      return parsed if isinstance(parsed, dict) else {}
                  except ValueError:
                      return {}
              return {}


          def _decode(body):
              text = body.get("content") or ""
              if not text:
                  return {}
              try:
                  raw = base64.b64decode(str(text))
                  # 缓存文件以 gzip+base64 存储，兼容早期的明文 JSON
                  if raw[:2] == b"\x1f\x8b":
                      raw = gzip.decompress(raw)
                  return json.loads(raw.decode("utf-8"))
              except (TypeError, ValueError, OSError):
                  return {}


          def _split(score):
              try:
                  home, away = [int(part) for part in str(score).split("-")]
                  return home, away
              except (TypeError, ValueError):
                  return None


          def main(additions, cache, enabled) -> dict:
              body = _as_dict(cache)
              sha = str(body.get("sha") or "")
              if str(enabled or "").strip().lower() != "true" or not sha:
                  return {"changed": False, "contentBase64": "", "sha": sha, "updated": 0}
              data = _decode(body)
              leagues = data.get("leagues") or {}
              updated = 0
              for code, pairs in (additions or {}).items():
                  target = leagues.setdefault(code, {})
                  for key, games in (pairs or {}).items():
                      entry = target.get(key)
                      if not isinstance(entry, dict):
                          entry = {"played": 0, "homeWins": 0, "draws": 0, "awayWins": 0, "last": []}
                      last = list(entry.get("last") or [])
                      known = {(item.get("date"), item.get("score")) for item in last}
                      for game in games or []:
                          scores = _split(game.get("score"))
                          if not scores:
                              continue
                          # last 保留真实主客场与真实比分，不做视角换算
                          item = {
                              "date": game.get("date"),
                              "home": game.get("home"),
                              "away": game.get("away"),
                              "score": f"{scores[0]}-{scores[1]}",
                          }
                          if (item["date"], item["score"]) in known:
                              continue
                          # 统计口径以小编号球队为主视角，用 lowIsHome 校正胜负归属
                          home_goals, away_goals = scores
                          low_goals, high_goals = (
                              (home_goals, away_goals) if game.get("lowIsHome") else (away_goals, home_goals)
                          )
                          entry["played"] = int(entry.get("played") or 0) + 1
                          if low_goals == high_goals:
                              entry["draws"] = int(entry.get("draws") or 0) + 1
                          elif low_goals > high_goals:
                              entry["homeWins"] = int(entry.get("homeWins") or 0) + 1
                          else:
                              entry["awayWins"] = int(entry.get("awayWins") or 0) + 1
                          last.append(item)
                          known.add((item["date"], item["score"]))
                          updated += 1
                      if last:
                          entry["last"] = sorted(last, key=lambda item: item.get("date") or "", reverse=True)[:5]
                      target[key] = entry
              if not updated:
                  return {"changed": False, "contentBase64": "", "sha": sha, "updated": 0}
              data["updatedAt"] = datetime.now(BJ).isoformat(timespec="seconds")
              # 缓存已超过代码节点单个输出变量的长度上限，改为紧凑 JSON + gzip 后 base64
              raw = json.dumps(data, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              payload = base64.b64encode(gzip.compress(raw, 6, mtime=0)).decode("ascii")
              return {
                  "changed": True,
                  "contentBase64": payload,
                  "sha": sha,
                  "updated": updated,
              }
        code_language: python3
        desc: ''
        outputs:
          changed:
            children: null
            type: boolean
          contentBase64:
            children: null
            type: string
          sha:
            children: null
            type: string
          updated:
            children: null
            type: number
        selected: false
        title: 合并交锋缓存
