              leagues = [code for code in ORDER if code in found]
              items = [
                  {
                      "league": code,
                      "sport": SPORT_BY_LEAGUE[code],
                      "index": index,
                      "url": BASE.format(sport=SPORT_BY_LEAGUE[code]),
                  }
                  for index, code in enumerate(leagues)
              ]
              return {"items": items, "leagues": leagues}
