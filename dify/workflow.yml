    - data:
        code: |
          import json
          from datetime import datetime, timezone


          def _parse(raw):
              if isinstance(raw, (dict, list)):
                  return raw
              if not raw:
                  return {}
              try:
                  return json.loads(raw)
              except (TypeError, ValueError):
                  return {}


          def _pool(matches):
              items = []
              for match in matches or []:
                  home = match.get("homeTeam") or {}
                  away = match.get("awayTeam") or {}
                  full = (match.get("score") or {}).get("fullTime") or {}
                  items.append({
                      "utc": str(match.get("utcDate") or ""),
                      "status": match.get("status"),
                      "homeId": home.get("id"),
                      "awayId": away.get("id"),
                      "homeName": home.get("shortName") or home.get("name") or "",
                      "awayName": away.get("shortName") or away.get("name") or "",
                      "homeGoals": full.get("home"),
                      "awayGoals": full.get("away"),
                  })
              items.sort(key=lambda item: item["utc"], reverse=True)
              return items


          def _games(pool_map, team_id, only=None, exclude=None):
              games = []
              if team_id is None:
                  return games
              for code, pool in (pool_map or {}).items():
                  if only and code != only:
                      continue
                  if exclude and code == exclude:
                      continue
                  for game in pool:
                      if game.get("homeId") == team_id:
                          games.append((code, game, True))
                      elif game.get("awayId") == team_id:
                          games.append((code, game, False))
              games.sort(key=lambda item: item[1]["utc"], reverse=True)
              return games


          def _avg(total, count):
              return round(total / count, 2) if count else None


          def _num(value):
              if value is None:
                  return "0"
              text = f"{float(value):.2f}".rstrip("0").rstrip(".")
              return text or "0"


          def _summary(games, split, label):
              # 直接输出成文本，避免结果嵌套过深触发变量深度限制
              played = gf = ga = 0
              home_played = home_for = home_against = 0
              away_played = away_for = away_against = 0
              leagues = []
              last = []
              for code, game, is_home in games:
                  home_goals, away_goals = game.get("homeGoals"), game.get("awayGoals")
                  if game.get("status") != "FINISHED" or home_goals is None or away_goals is None:
                      continue
                  own, opp = (home_goals, away_goals) if is_home else (away_goals, home_goals)
                  played += 1
                  gf += own
                  ga += opp
                  if code not in leagues:
                      leagues.append(code)
                  if is_home:
                      home_played += 1
                      home_for += own
                      home_against += opp
                  else:
                      away_played += 1
                      away_for += own
                      away_against += opp
                  if len(last) < 5:
                      result = "W" if own > opp else "D" if own == opp else "L"
                      opponent = game.get("awayName") if is_home else game.get("homeName")
                      last.append(
                          f"{game['utc'][:10]} {'主' if is_home else '客'} {own}-{opp} vs {opponent} {result}"
                      )
              if not played:
                  return f"{label}：暂无该队已结束的场次数据"
              source = "、".join(leagues) or "无"
              lines = [
                  f"{label}（来源赛事 {source}，样本 {played} 场）："
                  f"场均进 {_num(_avg(gf, played))} / 失 {_num(_avg(ga, played))}，合计进 {gf} / 失 {ga}"
              ]
              if split and home_played:
                  lines.append(
                      f"  主场 {home_played} 场：场均进 {_num(_avg(home_for, home_played))} / 失 {_num(_avg(home_against, home_played))}"
                  )
              if split and away_played:
                  lines.append(
                      f"  客场 {away_played} 场：场均进 {_num(_avg(away_for, away_played))} / 失 {_num(_avg(away_against, away_played))}"
                  )
              lines.append("  近 5 场（该队视角：主/客 进球-失球 对手 结果）：" + "；".join(last))
              return "\n".join(lines)


          def _load(pool_map, team_id, kickoff, exclude):
              # 前后 4 天内是否有其他赛事，用于提示赛程密度与轮换
              if team_id is None or kickoff is None:
                  return []
              hits = []
              for code, pool in (pool_map or {}).items():
                  if code == exclude:
                      continue
                  for game in pool:
                      if team_id not in (game.get("homeId"), game.get("awayId")):
                          continue
                      if game.get("status") in ("CANCELLED", "POSTPONED", "SUSPENDED"):
                          continue
                      try:
                          moment = datetime.fromisoformat(str(game.get("utc")).replace("Z", "+00:00"))
                      except (TypeError, ValueError):
                          continue
                      if moment.tzinfo is None:
                          moment = moment.replace(tzinfo=timezone.utc)
                      gap = (moment - kickoff).total_seconds() / 86400
                      if 0 < abs(gap) <= 4:
                          hits.append({
                              "league": code,
                              "date": str(game.get("utc"))[:10],
                              "venue": "主" if game.get("homeId") == team_id else "客",
                              "gapDays": round(gap, 1),
                          })
              hits.sort(key=lambda item: abs(item["gapDays"]))
              return hits[:2]


          def _load_line(pool_map, team_id, kickoff, exclude):
              hits = _load(pool_map, team_id, kickoff, exclude)
              if not hits:
                  return "前后 4 天内无其他赛事"
              return "、".join(
                  f"{abs(hit['gapDays'])} 天{'前' if hit['gapDays'] < 0 else '后'}（{hit['date']} {hit['league']} {hit['venue']}）"
                  for hit in hits
              )


          def _team(pool_map, team_id, league, kickoff, prefix):
              return {
                  prefix + "Own": _summary(_games(pool_map, team_id, only=league), True, "本赛事"),
                  prefix + "Cross": _summary(_games(pool_map, team_id, exclude=league), False, "跨赛事"),
                  prefix + "Load": _load_line(pool_map, team_id, kickoff, league),
              }


          def _relabel(pool, names):
              # 参考赛事的球队名统一成与预测赛事一致的叫法
              if not names:
                  return pool
              for game in pool:
                  mapped = names.get(game.get("homeId"))
                  if mapped:
                      game["homeName"] = mapped
                  mapped = names.get(game.get("awayId"))
                  if mapped:
                      game["awayName"] = mapped
              return pool


          def main(matches: list, pools, refs, names) -> dict:
              pool_map = {}
              if isinstance(pools, dict):
                  for key, value in pools.items():
                      pool_map[key] = value if isinstance(value, list) else []
              for entry in refs or []:
                  if not isinstance(entry, dict):
                      continue
                  code = entry.get("code")
                  if not code or code in pool_map:
                      continue
                  body = _parse(entry.get("body"))
                  items = body.get("matches") if isinstance(body, dict) else None
                  if items:
                      pool_map[code] = _relabel(_pool(items), names)

              result = []
              for match in matches or []:
                  if not isinstance(match, dict):
                      continue
                  item = dict(match)
                  league = item.get("league") or ""
                  try:
                      kickoff = datetime.fromisoformat(str(item.get("kickoff")).replace("Z", "+00:00"))
                      if kickoff.tzinfo is None:
                          kickoff = kickoff.replace(tzinfo=timezone.utc)
                  except (TypeError, ValueError):
                      kickoff = None
                  item.update(_team(pool_map, (item.get("home") or {}).get("id"), league, kickoff, "statsHome"))
                  item.update(_team(pool_map, (item.get("away") or {}).get("id"), league, kickoff, "statsAway"))
                  result.append(item)
              return {"matches": result}
