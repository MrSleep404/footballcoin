    - data:
        code: |
          import json
          from datetime import datetime, timezone


          def _tla(match):
              parts = str(match.get("id") or "").split("-")
              return parts[-2] if len(parts) >= 2 else ""


          def main(matches: list, spots: list, body) -> dict:
              if isinstance(body, str):
                  try:
                      body = json.loads(body)
                  except ValueError:
                      body = []
              if isinstance(body, list):
                  payload = body
              elif isinstance(body, dict):
                  payload = body.get("list") if isinstance(body.get("list"), list) else [body]
              else:
                  payload = []

              index_by_key = {}
              for spot in spots or []:
                  if isinstance(spot, dict) and spot.get("key"):
                      index_by_key[str(spot["key"])] = int(spot.get("index") or 0)

              count = 0
              for match in matches or []:
                  idx = index_by_key.get(f"{match.get('league')}:{_tla(match)}")
                  if idx is None or idx >= len(payload):
                      continue
                  hourly = (payload[idx] or {}).get("hourly") or {}
                  times = hourly.get("time") or []
                  try:
                      moment = datetime.fromisoformat(str(match.get("kickoff")).replace("Z", "+00:00"))
                  except (TypeError, ValueError):
                      continue
                  prefix = moment.astimezone(timezone.utc).strftime("%Y-%m-%dT%H")
                  pos = next((i for i, value in enumerate(times) if str(value).startswith(prefix)), None)
                  if pos is None:
                      continue
                  temp = hourly.get("temperature_2m") or []
                  precip = hourly.get("precipitation_probability") or []
                  wind = hourly.get("wind_speed_10m") or []
                  if pos >= len(temp):
                      continue
                  match["weather"] = {
                      "temp": temp[pos],
                      "precip": precip[pos] if pos < len(precip) else None,
                      "wind": wind[pos] if pos < len(wind) else None,
                  }
                  count += 1
              return {"matches": matches, "weatherCount": count}
        code_language: python3
        desc: ''
        outputs:
          matches:
            children: null
            type: array[object]
          weatherCount:
