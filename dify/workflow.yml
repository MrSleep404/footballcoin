    - data:
        code: |
          import unicodedata
          from datetime import datetime, timezone

          STOPWORDS = {
              "fc", "cf", "afc", "sc", "ac", "as", "us", "ss", "ssc", "sv", "vfl", "vfb",
              "tsg", "bsc", "kv", "rb", "club", "de", "do", "calcio", "cd", "ud", "rcd",
              "rc", "sd", "ca", "cs", "fk", "sk", "bk", "04", "05", "07", "1899",
          }
          ALIASES = {
              "munchen": "munich",
              "moenchengladbach": "gladbach",
              "monchengladbach": "gladbach",
              "internazionale": "inter",
              "milano": "milan",
              "atletico": "atleti",
          }


          def _tokens(name):
              text = unicodedata.normalize("NFKD", str(name or ""))
              text = "".join(ch for ch in text if not unicodedata.combining(ch)).lower()
              for src, dst in (("ø", "o"), ("ß", "ss"), ("æ", "ae"), ("ł", "l"), ("đ", "d"), ("ı", "i")):
                  text = text.replace(src, dst)
              for sep in "-'’. &/":
                  text = text.replace(sep, " ")
              return [ALIASES.get(token, token) for token in text.split() if token and token not in STOPWORDS]


          def _similar(left, right):
              first, second = set(_tokens(left)), set(_tokens(right))
              if not first or not second:
                  return 0.0
              shared = len(first & second)
              containment = shared / min(len(first), len(second))
              union = len(first | second)
              return max(containment, shared / union if union else 0.0)


          def _moment(text):
              try:
                  value = datetime.fromisoformat(str(text).replace("Z", "+00:00"))
              except (TypeError, ValueError):
                  return None
              if value.tzinfo is None:
                  value = value.replace(tzinfo=timezone.utc)
              return value.astimezone(timezone.utc)


          def main(matches: list, packs: list) -> dict:
              by_league = {}
              for pack in packs or []:
                  if not isinstance(pack, dict):
                      continue
                  league = pack.get("league")
                  if league:
                      by_league.setdefault(league, []).extend(pack.get("events") or [])

              count = 0
              for match in matches or []:
                  events = by_league.get(match.get("league")) or []
                  if not events:
                      continue
                  kickoff = _moment(match.get("kickoff"))
                  home = (match.get("home") or {}).get("nameEn") or ""
                  away = (match.get("away") or {}).get("nameEn") or ""
                  candidates = []
                  for event in events:
                      moment = _moment(event.get("commence"))
                      if kickoff and moment is None:
                          continue
                      gap = abs((moment - kickoff).total_seconds()) if kickoff and moment else 0.0
                      # 开球时间相差超过 90 分钟视为不同场次
                      if kickoff and gap > 5400:
                          continue
                      score = min(_similar(home, event.get("home")), _similar(away, event.get("away")))
                      candidates.append((score, -gap, event))
                  if not candidates:
                      continue
                  if len(candidates) == 1:
                      chosen = candidates[0][2]
                  else:
                      candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
                      if candidates[0][0] < 0.45:
                          continue
                      chosen = candidates[0][2]
                  match["market"] = {
                      "bookmaker": f"市场均值（{chosen.get('books')} 家）",
                      "capturedAt": chosen.get("capturedAt") or "",
                      "prob": chosen.get("prob") or {"home": 0, "draw": 0, "away": 0},
                  }
                  count += 1
              return {"matches": matches, "marketCount": count}
