          import unicodedata

          KEYS = ("home", "draw", "away")
          STOPWORDS = {
              "fc", "cf", "afc", "sc", "ac", "as", "us", "ss", "ssc", "sv",
              "vfl", "vfb", "tsg", "bsc", "kv", "rb", "club", "de", "do", "calcio",
          }
          ALIASES = {
              "munchen": "munich",
              "moenchengladbach": "gladbach",
              "monchengladbach": "gladbach",
              "inter": "internazionale",
          }


          def _tokens(name):
              text = unicodedata.normalize("NFKD", str(name or ""))
              text = "".join(ch for ch in text if not unicodedata.combining(ch)).lower()
              for src, dst in (("ø", "o"), ("ß", "ss"), ("æ", "ae"), ("ł", "l"), ("đ", "d"), ("ı", "i")):
                  text = text.replace(src, dst)
              for sep in "-'’.&/":
                  text = text.replace(sep, " ")
              return [ALIASES.get(token, token) for token in text.split() if token and token not in STOPWORDS]


          def _injuries_for(teams, name, day):
              parts = _tokens(name)
              if not parts or not isinstance(teams, dict):
                  return []
              prefix = f"{day}|"
              if not day:
                  return []
              if prefix + " ".join(sorted(parts)) in teams:
                  return teams[prefix + " ".join(sorted(parts))]
              current = set(parts)
              for other, items in teams.items():
                  other = str(other)
                  if not other.startswith(prefix):
                      continue
                  candidate = set(other[len(prefix):].split())
                  if len(current) >= 2 and current <= candidate:
                      return items
                  if len(candidate) >= 2 and candidate <= current:
                      return items
              return []


          def _attach_injuries(merged, injuries):
              if not isinstance(injuries, dict):
                  return
              teams = injuries.get("teams") or {}
              # 伤病按比赛自身的 UTC 开球日取名单，不再依赖全局查询日期
              day = str(merged.get("kickoff") or "")[:10]
              if not teams or not day:
                  return
              home = _injuries_for(teams, (merged.get("home") or {}).get("nameEn"), day)
              away = _injuries_for(teams, (merged.get("away") or {}).get("nameEn"), day)
              if home or away:
                  merged["injuries"] = {"date": day, "home": home, "away": away}


          def _clamp(value, lo, hi, default):
              try:
                  return max(lo, min(hi, int(round(float(value)))))
              except (TypeError, ValueError):
                  return default


          def _extract_json(text):
              if not isinstance(text, str):
                  return None
              raw = re.sub(r"<think\b[^>]*>.*?</think\s*>", "", text, flags=re.S | re.I).strip()
              fence = re.search(r"```(?:json)?\s*(.*?)```", raw, flags=re.S | re.I)
              if fence:
                  raw = fence.group(1).strip()
              try:
                  return json.loads(raw)
              except (TypeError, ValueError):
                  pass
              start = raw.find("{")
              while start != -1:
                  depth = 0
                  in_string = False
                  escaped = False
                  for index in range(start, len(raw)):
                      char = raw[index]
                      if in_string:
                          if escaped:
                              escaped = False
                          elif char == "\\":
                              escaped = True
                          elif char == '"':
                              in_string = False
                      elif char == '"':
                          in_string = True
                      elif char == "{":
                          depth += 1
                      elif char == "}":
                          depth -= 1
                          if depth == 0:
                              try:
                                  return json.loads(raw[start : index + 1])
                              except (TypeError, ValueError):
                                  break
                  start = raw.find("{", start + 1)
              return None


          def _parse_match(match):
              if isinstance(match, dict):
                  return dict(match)
              try:
                  return json.loads(match)
              except (TypeError, ValueError):
                  return {}


          def _normalize_prob(raw):
              if not isinstance(raw, dict):
                  return None
              if not all(isinstance(raw.get(key), (int, float)) for key in KEYS):
                  return None
              total = sum(float(raw[key]) for key in KEYS)
              if total <= 0:
                  return None
              prob = {key: _clamp(float(raw[key]) / total * 100, 1, 98, 1) for key in KEYS}
              diff = 100 - sum(prob.values())
              top = max(prob, key=prob.get)
              prob[top] += diff
              return prob


          def _fallback(match):
              home_rank = _clamp((match.get("home") or {}).get("rank"), 1, 40, 20)
              away_rank = _clamp((match.get("away") or {}).get("rank"), 1, 40, 20)
              home = max(15, min(70, int(round(45 + (away_rank - home_rank) * 1.2))))
              draw = 27
              away = max(1, 100 - home - draw)
              prob = {"home": home, "draw": draw, "away": away}
              pick = max(prob, key=prob.get)
              return {
                  "prob": prob,
                  "score": _align_score({"home": 1, "away": 1}, pick),
                  "confidence": 30,
                  "pick": pick,
                  "reasons": [
                      "模型未返回有效结果，使用排名先验估计",
                      "该结果仅基于积分榜排名差，参考价值有限",
                  ],
                  "factors": ["排名差"],
                  "risk": "该场为兜底结果，仅供参考",
              }


          def _align_score(score, pick):
              home = _clamp((score or {}).get("home"), 0, 9, 1)
              away = _clamp((score or {}).get("away"), 0, 9, 1)
              if pick == "home" and home <= away:
                  home = min(9, away + 1)
                  if home == away:
                      away = max(0, home - 1)
              elif pick == "away" and away <= home:
                  away = min(9, home + 1)
                  if away == home:
                      home = max(0, away - 1)
              elif pick == "draw" and home != away:
                  both = max(0, min(9, int(round((home + away) / 2))))
                  home = away = both
              return {"home": home, "away": away}


          def main(raw_text: str, match, injuries) -> dict:
              item = _parse_match(match)
              merged = dict(item)
              _attach_injuries(merged, injuries)
              # 统计口径只服务提示词，不写入数据文件
              for key in ("statsHomeOwn", "statsHomeCross", "statsHomeLoad",
                          "statsAwayOwn", "statsAwayCross", "statsAwayLoad"):
                  merged.pop(key, None)
              for side in ("home", "away"):
                  team = merged.get(side)
                  if isinstance(team, dict):
                      team = dict(team)
                      team.pop("id", None)
                      merged[side] = team

              data = _extract_json(raw_text)
              if not isinstance(data, dict):
                  merged["prediction"] = _fallback(item)
                  merged["degraded"] = True
                  return {"match": merged}

              prob = _normalize_prob(data.get("prob"))
              if prob is None:
                  merged["prediction"] = _fallback(item)
                  merged["degraded"] = True
                  return {"match": merged}

              score = data.get("score") or {}
              reasons = [str(text)[:40] for text in (data.get("reasons") or []) if str(text).strip()][:4]
              if len(reasons) < 2:
                  reasons.append("综合双方近期状态与排名给出判断")
              factors = [str(text)[:12] for text in (data.get("factors") or []) if str(text).strip()][:5]

              pick = max(prob, key=prob.get)
              merged["prediction"] = {
                  "prob": prob,
                  "score": _align_score(score, pick),
                  "confidence": _clamp(data.get("confidence"), 0, 100, 50),
                  "pick": pick,
                  "reasons": reasons,
                  "factors": factors,
                  "risk": str(data.get("risk") or "")[:60],
              }
              merged["degraded"] = False
              return {"match": merged}
        code_language: python3
