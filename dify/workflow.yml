    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables: []
      height: 54
      id: start
      position:
        x: 40
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          from datetime import datetime, timedelta, timezone

          BJ = timezone(timedelta(hours=8))


          def main(mode: str, competition_set: str) -> dict:
              value = (mode or "both").strip().lower()
              tomorrow = (datetime.now(timezone.utc) + timedelta(days=1)).strftime("%Y-%m-%d")
              if value == "results":
                  return {"result": [], "injuryDate": tomorrow}
              group = (competition_set or "domestic").strip().lower()
              if group in ("europe", "euro", "cl"):
                  return {"result": ["CL"], "injuryDate": tomorrow}
              if group in ("all", "both"):
                  return {"result": ["PL", "PD", "SA", "BL1", "FL1", "CL"], "injuryDate": tomorrow}
              return {"result": ["PL", "PD", "SA", "BL1", "FL1"], "injuryDate": tomorrow}
        code_language: python3
        desc: ''
        outputs:
          result:
            children: null
            type: array[string]
          injuryDate:
            children: null
            type: string
        selected: false
        title: 联赛列表
        type: code
        variables:
        - value_selector:
          - env
          - RUN_MODE
          variable: mode
        - value_selector:
          - env
          - COMPETITION_SET
          variable: competition_set
      height: 90
      id: code_leagues
      position:
