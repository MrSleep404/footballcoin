    - data:
        code: |
          from datetime import datetime, timezone


          def main(matches: list) -> dict:
              # API-Football 的伤病按 UTC 日期划分，这里从赛程反推比赛日，只取最近 3 天
              days = []
              for match in matches or []:
                  kickoff = match.get("kickoff") if isinstance(match, dict) else None
                  if not kickoff:
                      continue
                  try:
                      moment = datetime.fromisoformat(str(kickoff).replace("Z", "+00:00"))
                  except (TypeError, ValueError):
                      continue
                  if moment.tzinfo is None:
                      moment = moment.replace(tzinfo=timezone.utc)
                  day = moment.astimezone(timezone.utc).strftime("%Y-%m-%d")
                  if day not in days:
                      days.append(day)
              days.sort()
              return {"dates": days[:3], "count": len(days[:3])}
        code_language: python3
