    - data:
        code: |
          import base64
          import json
          from datetime import datetime, timedelta, timezone

          BJ = timezone(timedelta(hours=8))
          LEAGUES = ("PL", "PD", "SA", "BL1", "FL1", "CL")


          def _parse(raw):
              if isinstance(raw, dict):
                  return raw
              if isinstance(raw, str) and raw:
                  try:
                      value = json.loads(raw)
                  except (TypeError, ValueError):
                      return {}
                  return value if isinstance(value, dict) else {}
              return {}


          def _code(team):
              team = team or {}
              tla = str(team.get("tla") or "").strip()
              if tla:
                  return tla.upper()
              name = team.get("shortName") or team.get("name") or "XXX"
              letters = "".join(ch for ch in name if ch.isalnum()).upper()
              return letters[:3] or "XXX"


          def _goals(match):
              score = match.get("score") or {}
              for key in ("fullTime", "regularTime"):
                  part = score.get(key) or {}
                  home, away = part.get("home"), part.get("away")
                  if isinstance(home, int) and isinstance(away, int):
                      return home, away
              return None


          def _date(value):
              try:
                  kickoff = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              except (TypeError, ValueError):
                  return ""
              if kickoff.tzinfo is None:
                  kickoff = kickoff.replace(tzinfo=timezone.utc)
              return kickoff.astimezone(BJ).strftime("%Y-%m-%d")


          def main(responses: list) -> dict:
              now = datetime.now(BJ).isoformat(timespec="seconds")
              grouped = {}
              for raw in responses or []:
                  for match in _parse(raw).get("matches") or []:
                      if match.get("status") != "FINISHED":
                          continue
                      league = str((match.get("competition") or {}).get("code") or "").upper()
                      if league not in LEAGUES:
                          continue
                      goals = _goals(match)
                      date = _date(match.get("utcDate"))
                      if goals is None or not date:
                          continue
                      home_goals, away_goals = goals
                      home = match.get("homeTeam") or {}
                      away = match.get("awayTeam") or {}
                      match_id = f"{league}-{date}-{_code(home)}-{_code(away)}"
                      if home_goals > away_goals:
                          outcome = "home"
                      elif home_goals < away_goals:
                          outcome = "away"
                      else:
                          outcome = "draw"
                      grouped.setdefault(date, {})[match_id] = {
                          "id": match_id,
                          "league": league,
                          "homeGoals": home_goals,
                          "awayGoals": away_goals,
                          "outcome": outcome,
                          "status": "FT",
                          "updatedAt": now,
                      }

              days = []
              for date in sorted(grouped):
                  results = [grouped[date][key] for key in sorted(grouped[date])]
                  payload = {
                      "schemaVersion": 1,
                      "date": date,
                      "generatedAt": now,
                      "source": "football-data.org",
                      "count": len(results),
                      "results": results,
                  }
                  text = json.dumps(payload, ensure_ascii=False, indent=2)
                  days.append({
                      "date": date,
                      "count": len(results),
                      "content": text,
                      "contentBase64": base64.b64encode(text.encode("utf-8")).decode("ascii"),
                      "byteSize": len(text.encode("utf-8")),
                      "commitMessage": f"data: {date} 赛果（{len(results)} 场）",
                  })
              return {"days": days}
        code_language: python3
        desc: ''
        outputs:
          days:
            children: null
            type: array[object]
        selected: false
        title: 组装赛果文件
