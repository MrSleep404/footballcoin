    - data:
        code: |
          import json
          import unicodedata

          STOPWORDS = {
              "fc", "cf", "afc", "sc", "ac", "as", "us", "ss", "ssc", "sv",
              "vfl", "vfb", "tsg", "bsc", "kv", "rb", "club", "de", "do", "calcio",
          }
          ALIASES = {
              "munchen": "munich",
              "moenchengladbach": "gladbach",
              "monchengladbach": "gladbach",
              "inter": "internazionale",
          }


          def _tokens(name):
              text = unicodedata.normalize("NFKD", str(name or ""))
              text = "".join(ch for ch in text if not unicodedata.combining(ch)).lower()
              for src, dst in (("ø", "o"), ("ß", "ss"), ("æ", "ae"), ("ł", "l"), ("đ", "d"), ("ı", "i")):
                  text = text.replace(src, dst)
              for sep in "-'’.&/":
                  text = text.replace(sep, " ")
              return [ALIASES.get(token, token) for token in text.split() if token and token not in STOPWORDS]


          def _parse(raw):
              if isinstance(raw, str):
                  try:
                      return json.loads(raw)
                  except ValueError:
                      return {}
              return raw if isinstance(raw, dict) else {}


          def main(items: list) -> dict:
              # 每个日期一份响应，按「日期|球队」拼键，输出结构与单日期版本保持一致
              teams = {}
              records = 0
              for entry in items or []:
                  item = entry if isinstance(entry, dict) else {}
                  day = str(item.get("date") or "")[:10]
                  if not day:
                      continue
                  payload = _parse(item.get("body"))
                  for row in payload.get("response") or []:
                      tokens = _tokens((row.get("team") or {}).get("name"))
                      if not tokens:
                          continue
                      player = row.get("player") or {}
                      key = day + "|" + " ".join(sorted(tokens))
                      teams.setdefault(key, []).append(
                          {
                              "player": player.get("name") or "",
                              "type": player.get("type") or "",
                              "reason": player.get("reason") or "",
                          }
                      )
                      records += 1
              return {"injuries": {"teams": teams}, "teamCount": len(teams), "recordCount": records}
        code_language: python3
        desc: ''
        outputs:
          injuries:
            children: null
            type: object
          teamCount:
            children: null
            type: number
          recordCount:
            children: null
            type: number
        selected: false
        title: 整理伤病
        type: code
        variables:
        - value_selector:
          - iter_injuries
          - output
          variable: items
