    - data:
        code: |
          import json

          BASE = ("http://api.open-meteo.com/v1/forecast"
                  "?hourly=temperature_2m,precipitation_probability,wind_speed_10m&timezone=UTC&forecast_days=8")


          def _items(value):
              if isinstance(value, str):
                  try:
                      value = json.loads(value)
                  except ValueError:
                      return []
              return value if isinstance(value, list) else []


          def main(spots: list, geos) -> dict:
              merged = []
              for spot in _items(spots):
                  if isinstance(spot, dict) and spot.get("key"):
                      merged.append({
                          "key": str(spot["key"]),
                          "index": int(spot.get("index") or 0),
                          "lat": float(spot["lat"]),
                          "lon": float(spot["lon"]),
                      })
              for geo in _items(geos):
                  if not isinstance(geo, dict) or not geo.get("found") or not geo.get("key"):
                      continue
                  merged.append({
                      "key": str(geo["key"]),
                      "index": int(geo.get("index") or 0),
                      "lat": float(geo["lat"]),
                      "lon": float(geo["lon"]),
                  })
              merged.sort(key=lambda item: item["index"])
              spots = []
              seen = set()
              for item in merged:
                  if item["key"] in seen:
                      continue
                  seen.add(item["key"])
                  spots.append({"key": item["key"], "index": len(spots), "lat": item["lat"], "lon": item["lon"]})
              if not spots:
                  return {"url": BASE + "&latitude=51.55&longitude=-0.11", "spots": []}
              lats = ",".join(f"{spot['lat']:.2f}" for spot in spots)
              lons = ",".join(f"{spot['lon']:.2f}" for spot in spots)
              return {"url": f"{BASE}&latitude={lats}&longitude={lons}", "spots": spots}
