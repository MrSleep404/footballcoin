        code: |
          from datetime import datetime, timedelta, timezone

          BJ = timezone(timedelta(hours=8))


          def main(matches: list) -> dict:
              days = {}
              for match in matches or []:
                  try:
                      kickoff = datetime.fromisoformat(str(match.get("kickoff")).replace("Z", "+00:00"))
                  except (TypeError, ValueError):
                      continue
                  date = kickoff.astimezone(BJ).strftime("%Y-%m-%d")
                  days.setdefault(date, []).append(match)

              result = []
              for date in sorted(days.keys()):
                  items = sorted(days[date], key=lambda item: item["kickoff"])
                  result.append({
                      "date": date,
                      "matches": items,
                      "degradedCount": sum(1 for item in items if item.get("degraded")),
                  })
              return {"days": result}
